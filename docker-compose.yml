version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nasa_postgres
    environment:
      POSTGRES_DB: nasa_publications
      POSTGRES_USER: nasa_user
      POSTGRES_PASSWORD: nasa_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/init-postgres.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nasa_user -d nasa_publications"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.15
    container_name: nasa_neo4j
    environment:
      NEO4J_AUTH: neo4j/nasa_password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: 'true'
      NEO4J_apoc_import_file_enabled: 'true'
      NEO4J_apoc_import_file_use__neo4j__config: 'true'
      NEO4J_ACCEPT_LICENSE_AGREEMENT: 'yes'
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "nasa_password", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nasa_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nasa-api:
    build: .
    container_name: nasa_api
    environment:
      # Database URLs adapted for Docker network
      POSTGRES_URL: "postgresql+psycopg2://nasa_user:nasa_password@postgres:5432/nasa_publications"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: nasa_password
      NEO4J_DATABASE: neo4j
      REDIS_URL: "redis://redis:6379"
      REDIS_ENABLED: "true"
      # External API keys from your .env
      NCBI_API_KEY: "${NCBI_API_KEY}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
      MISTRAL_API_KEY: "${MISTRAL_API_KEY}"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./data:/app/data  # Pour les fichiers de données si nécessaire
      - ./logs:/app/logs  # Pour les logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 60s #assuming that the embedding model will take some time to download the first time
      retries: 3

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
  redis_data: